<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONE PIECE CARD GAME 全カード検索</title>
<style>
:root{--bg:#07111f;--panel:#0e1b2d;--panel2:#13243a;--line:#29405d;--text:#edf5ff;--muted:#9fb2c9;--accent:#f2b441;--danger:#ff7b72}
*{box-sizing:border-box}html{scroll-padding-top:250px}body{margin:0;background:linear-gradient(145deg,#06101d,#0c1b2d 55%,#07111f);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
header{background:rgba(7,17,31,.97);border-bottom:1px solid var(--line);padding:18px 22px}
h1{margin:0;font-size:clamp(20px,3vw,32px)}.sub{margin-top:6px;color:var(--muted);font-size:13px}.wrap{max-width:1600px;margin:auto;padding:0 18px 18px}
.search-sticky{position:sticky;top:0;z-index:20;background:rgba(7,17,31,.98);backdrop-filter:blur(12px);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.controls{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:9px;background:var(--panel);padding:12px;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.field{min-width:0}.field label{display:block;color:var(--muted);font-size:11px;font-weight:700;margin:0 0 4px 2px}.span-3{grid-column:span 3}.span-2{grid-column:span 2}.span-1{grid-column:span 1}.range{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:5px}.range span{color:var(--muted)}
input,select,button,.multi summary{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:9px 10px;font-size:13px;min-height:39px}input::placeholder{color:#7f93aa}button{cursor:pointer;font-weight:700}button:hover,.multi summary:hover{border-color:var(--accent)}
.actions{display:flex;gap:8px;align-items:end}.actions button{flex:1}.reset{color:#d5e4f5}
.multi{position:relative}.multi summary{list-style:none;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.multi summary::-webkit-details-marker{display:none}.multi summary:after{content:'▼';float:right;font-size:9px;margin-top:4px;color:var(--muted)}.multi[open] summary{border-color:var(--accent)}
.multi-menu{position:absolute;top:calc(100% + 5px);left:0;z-index:40;min-width:220px;max-width:330px;max-height:280px;overflow:auto;background:#102038;border:1px solid var(--line);border-radius:10px;padding:7px;box-shadow:0 16px 35px rgba(0,0,0,.5)}.multi-menu label{display:flex;gap:8px;align-items:center;padding:7px 6px;margin:0;border-radius:6px;color:var(--text);font-size:13px;font-weight:400;cursor:pointer}.multi-menu label:hover{background:#1a304c}.multi-menu input{width:16px;min-height:auto;height:16px;margin:0;accent-color:var(--accent)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 0}.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12px}.pill b{color:var(--accent)}
.notice{background:#291f0d;border:1px solid #70551c;color:#ffe3a3;border-radius:10px;padding:11px 13px;margin:12px 0;font-size:13px;line-height:1.65}
.tablebox{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);max-height:calc(100vh - 235px)}table{border-collapse:separate;border-spacing:0;width:100%;min-width:1200px;font-size:13px}th{position:sticky;top:0;z-index:2;background:#13243a;color:#cfe2f8;text-align:left;padding:11px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:10px 11px;border-bottom:1px solid #203550;vertical-align:top;line-height:1.55}tr:hover td{background:#112239}.num{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap}.name{font-weight:750;min-width:160px}.effect{min-width:340px;max-width:620px;color:#dbe8f7}.muted{color:var(--muted)}a{color:#73b7ff;text-decoration:none}a:hover{text-decoration:underline}.badge{display:inline-block;border:1px solid #486586;border-radius:999px;padding:1px 7px;margin:1px;font-size:11px}.loading{text-align:center;padding:40px;color:var(--muted)}
@media(max-width:1100px){.span-3{grid-column:span 6}.span-2{grid-column:span 3}.span-1{grid-column:span 3}.tablebox{max-height:calc(100vh - 330px)}}
@media(max-width:700px){header{padding:13px 12px}.wrap{padding:0 8px 10px}.search-sticky{padding-top:7px}.controls{grid-template-columns:repeat(2,minmax(0,1fr));padding:8px}.span-3,.span-2,.span-1{grid-column:span 1}.field.keyword,.field.pack,.field.actions{grid-column:1/-1}.tablebox{max-height:calc(100vh - 420px)}.multi-menu{position:fixed;left:10px;right:10px;top:120px;max-width:none;max-height:55vh}}
</style>
</head>
<body>
<header><h1>ONE PIECE CARD GAME 全カード検索</h1><div class="sub">カード番号・カード名・種類・コスト・パワー・カウンター・色・効果概要などから検索</div></header>
<main class="wrap">
  <section class="search-sticky">
    <div class="controls">
      <div class="field keyword span-3"><label for="q">キーワード</label><input id="q" placeholder="カード番号・カード名・特徴・効果"></div>
      <div class="field span-2"><label for="category">カード種類</label><select id="category"><option value="">すべて</option></select></div>
      <div class="field span-2"><label>コスト（範囲）</label><div class="range"><input id="costMin" type="number" min="0" placeholder="最小"><span>～</span><input id="costMax" type="number" min="0" placeholder="最大"></div></div>
      <div class="field span-2"><label>パワー（範囲）</label><div class="range"><input id="powerMin" type="number" min="0" step="1000" placeholder="最小"><span>～</span><input id="powerMax" type="number" min="0" step="1000" placeholder="最大"></div></div>
      <div class="field span-1"><label>カウンター値</label><details class="multi" id="counterMulti"><summary>すべて</summary><div class="multi-menu" id="counterOptions"></div></details></div>
      <div class="field span-1"><label>色</label><details class="multi" id="colorMulti"><summary>すべて</summary><div class="multi-menu" id="colorOptions"></div></details></div>
      <div class="field span-2"><label>効果（概要）</label><details class="multi" id="effectMulti"><summary>すべて</summary><div class="multi-menu" id="effectOptions"></div></details></div>
      <div class="field pack span-3"><label for="pack">収録商品・パック</label><select id="pack"><option value="">すべて</option></select></div>
      <div class="field actions span-2"><button id="reset" class="reset">条件クリア</button><button id="csv">CSV出力</button></div>
    </div>
    <div class="stats"><span class="pill">読込件数 <b id="total">0</b></span><span class="pill">表示件数 <b id="shown">0</b></span><span class="pill">最終生成 <b id="generated">確認中</b></span></div>
  </section>
  <div class="notice">複数選択項目は、同じ項目内では「いずれかに一致」で検索します。異なる検索項目同士は「すべての条件に一致」で絞り込みます。</div>
  <div class="tablebox"><table><thead><tr><th>カード№</th><th>カード名</th><th>カード種類</th><th>コスト</th><th>パワー</th><th>カウンター値</th><th>色</th><th>効果（概要）</th><th>収録</th><th>確認</th></tr></thead><tbody id="body"><tr><td colspan="10" class="loading">カードデータを読み込んでいます…</td></tr></tbody></table></div>
</main>
<script>
const BASES=['https://cdn.jsdelivr.net/gh/buhbbl/punk-records@main/japanese','https://raw.githubusercontent.com/buhbbl/punk-records/main/japanese'];
let cards=[],filtered=[],packs={};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jpCat={Leader:'リーダー',Character:'キャラクター',Event:'イベント',Stage:'ステージ',Don:'ドン!!'};
const jpColor={Red:'赤',Green:'緑',Blue:'青',Purple:'紫',Black:'黒',Yellow:'黄'};
const effectRules=[['速攻','速攻'],['ブロッカー','ブロッカー'],['登場時','登場時効果'],['アタック時','アタック時効果'],['起動メイン','起動メイン'],['ターン1回','ターン1回'],['KO時','KO時効果'],['トリガー','トリガー'],['ドロー','カードを引く'],['手札','手札操作'],['デッキ','デッキ操作'],['ライフ','ライフ操作'],['パワー','パワー増減'],['レスト','レスト操作'],['KO','KO関連'],['コスト','コスト操作'],['ドン','ドン!!操作']];
function effectTags(c){
 const t=((c.effect||'')+' '+(c.trigger||'')).replace(/<br\s*\/?\s*>/gi,' ');if(!t.trim())return ['効果なし'];
 const tags=[];for(const [k,v] of effectRules)if(t.includes(k)&&!tags.includes(v))tags.push(v);return tags.length?tags:['固有効果あり'];
}
function effectSummary(c){return effectTags(c).slice(0,7).map(x=>`<span class="badge">${esc(x)}</span>`).join(' ')}
function num(v){const n=Number(String(v??'').replace(/[^0-9.-]/g,''));return Number.isFinite(n)?n:null}
function selected(name){return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(x=>x.value)}
function makeMulti(containerId,name,values,labeler=v=>v){$(containerId).innerHTML=values.map(v=>`<label><input type="checkbox" name="${name}" value="${esc(v)}"><span>${esc(labeler(v))}</span></label>`).join('')}
function updateSummary(detailsId,name){const vals=selected(name),summary=$(detailsId).querySelector('summary');summary.textContent=vals.length?`${vals.length}件選択`:'すべて'}
async function getJSON(path){let last;for(const base of BASES){try{const r=await fetch(`${base}/${path}`,{cache:'no-store'});if(!r.ok)throw new Error(`${r.status} ${base}/${path}`);return await r.json()}catch(e){last=e}}throw last}
async function load(){
 try{
  const [packData,manifest]=await Promise.all([getJSON('packs.json'),getJSON('manifest.json').catch(()=>null)]);
  const list=Array.isArray(packData)?packData:Object.values(packData);list.forEach(p=>packs[p.id]=p);
  const results=await Promise.allSettled(list.map(p=>getJSON(`data/${encodeURIComponent(p.id)}.json`)));let all=[],failed=0;
  results.forEach(r=>{if(r.status==='fulfilled')all.push(...(Array.isArray(r.value)?r.value:Object.values(r.value)));else failed++});
  const map=new Map();all.forEach(c=>{const key=[c.id,c.name,c.pack_id,c.img_full_url||''].join('|');if(!map.has(key))map.set(key,c)});
  cards=[...map.values()].sort((a,b)=>(a.id||'').localeCompare(b.id||'','ja',{numeric:true})||(a.pack_id||'').localeCompare(b.pack_id||''));
  $('total').textContent=cards.length.toLocaleString();if(failed)console.warn(`${failed}件の商品データの読込に失敗しました`);
  $('generated').textContent=manifest?.generated_at?new Date(manifest.generated_at*1000).toLocaleString('ja-JP'):'不明';buildFilters();apply();
 }catch(e){$('body').innerHTML=`<tr><td colspan="10" class="loading" style="color:var(--danger)">読み込みに失敗しました。GitHub Pages上で開き、ネットワーク接続を確認してください。<br>${esc(e.message)}</td></tr>`}
}
function buildFilters(){
 [...new Set(cards.map(c=>c.category).filter(Boolean))].sort().forEach(v=>$('category').insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(jpCat[v]||v)}</option>`));
 const colors=[...new Set(cards.flatMap(c=>c.colors||[]))].sort();makeMulti('colorOptions','color',colors,v=>jpColor[v]||v);
 const counters=[...new Set(cards.map(c=>String(c.counter??'')).filter(v=>v!==''))].sort((a,b)=>(num(a)??999999)-(num(b)??999999)||a.localeCompare(b));makeMulti('counterOptions','counter',counters,v=>v||'-');
 const effects=[...new Set(cards.flatMap(effectTags))].sort((a,b)=>a.localeCompare(b,'ja'));makeMulti('effectOptions','effect',effects);
 Object.values(packs).sort((a,b)=>(a.raw_title||'').localeCompare(b.raw_title||'','ja')).forEach(p=>$('pack').insertAdjacentHTML('beforeend',`<option value="${esc(p.id)}">${esc(p.raw_title||p.id)}</option>`));
 document.querySelectorAll('.multi input').forEach(el=>el.addEventListener('change',()=>{updateSummary(el.closest('details').id,el.name);apply()}));
}
function inRange(value,minId,maxId){const n=num(value),minV=$(`${minId}`).value===''?null:Number($(`${minId}`).value),maxV=$(`${maxId}`).value===''?null:Number($(`${maxId}`).value);if(minV===null&&maxV===null)return true;if(n===null)return false;return(minV===null||n>=minV)&&(maxV===null||n<=maxV)}
function apply(){
 const q=$('q').value.trim().toLowerCase(),cat=$('category').value,pack=$('pack').value,counters=selected('counter'),colors=selected('color'),effects=selected('effect');
 filtered=cards.filter(c=>{
  const hay=[c.id,c.name,c.category,(c.colors||[]).join(' '),(c.types||[]).join(' '),c.effect,c.trigger,c.pack_id].join(' ').toLowerCase();
  const tags=effectTags(c);
  return(!q||hay.includes(q))&&(!cat||c.category===cat)&&(!pack||c.pack_id===pack)&&inRange(c.cost,'costMin','costMax')&&inRange(c.power,'powerMin','powerMax')&&(!counters.length||counters.includes(String(c.counter??'')))&&(!colors.length||colors.some(v=>(c.colors||[]).includes(v)))&&(!effects.length||effects.some(v=>tags.includes(v)));
 });
 $('shown').textContent=filtered.length.toLocaleString();render(filtered.slice(0,3000));
}
function render(rows){
 if(!rows.length){$('body').innerHTML='<tr><td colspan="10" class="loading">該当カードはありません。</td></tr>';return}
 $('body').innerHTML=rows.map(c=>{const title=packs[c.pack_id]?.raw_title||c.pack_id||'-',official=`https://www.onepiece-cardgame.com/cardlist/?freewords=${encodeURIComponent(c.id||c.name||'')}&search=true`;return `<tr><td class="num">${esc(c.id||'-')}</td><td class="name">${esc(c.name||'-')}</td><td>${esc(jpCat[c.category]||c.category||'-')}</td><td>${esc(c.cost??'-')}</td><td>${esc(c.power??'-')}</td><td>${esc(c.counter??'-')}</td><td>${esc((c.colors||[]).map(x=>jpColor[x]||x).join('/'))}</td><td class="effect">${effectSummary(c)}</td><td class="muted">${esc(title)}</td><td><a href="${official}" target="_blank" rel="noopener">公式検索</a></td></tr>`}).join('');
 if(filtered.length>3000)$('body').insertAdjacentHTML('beforeend',`<tr><td colspan="10" class="loading">表示負荷軽減のため先頭3,000件まで表示しています。CSVには全${filtered.length.toLocaleString()}件を出力できます。</td></tr>`)
}
function exportCSV(){const head=['カード№','カード名','カード種類','コスト','パワー','カウンター値','色','効果概要','収録','公式URL'];const rows=filtered.map(c=>[c.id,c.name,jpCat[c.category]||c.category,c.cost??'',c.power??'',c.counter??'',(c.colors||[]).map(x=>jpColor[x]||x).join('/'),effectTags(c).join('/'),packs[c.pack_id]?.raw_title||c.pack_id,`https://www.onepiece-cardgame.com/cardlist/?freewords=${encodeURIComponent(c.id||c.name||'')}&search=true`]);const csv='\ufeff'+[head,...rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='onepiece_card_catalog.csv';a.click();URL.revokeObjectURL(a.href)}
function resetFilters(){$('q').value='';$('category').value='';$('pack').value='';['costMin','costMax','powerMin','powerMax'].forEach(id=>$(id).value='');document.querySelectorAll('.multi input:checked').forEach(x=>x.checked=false);[['counterMulti','counter'],['colorMulti','color'],['effectMulti','effect']].forEach(([id,n])=>updateSummary(id,n));apply()}
['q','costMin','costMax','powerMin','powerMax'].forEach(id=>$(id).addEventListener('input',apply));['category','pack'].forEach(id=>$(id).addEventListener('change',apply));$('reset').addEventListener('click',resetFilters);$('csv').addEventListener('click',exportCSV);
document.addEventListener('click',e=>document.querySelectorAll('.multi[open]').forEach(d=>{if(!d.contains(e.target))d.removeAttribute('open')}));load();
</script>
</body></html>
